[package]
name = "mdit-rs-native"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
mdit-rs-wasm = { path = "../rust-wasm" }
mdust = { path = "../../crates/mdust" }
mimalloc = { version = "0.1", optional = true }
tikv-jemallocator = { version = "0.6", optional = true }

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

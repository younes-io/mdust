name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # fixtures_match_oracle needs bench/node_modules and the fetched bench/corpus.
      - run: cargo test -p mdust -- --skip fixtures_match_oracle
      - run: npm --prefix npm run build
      - run: npm pack
        working-directory: npm
      - name: Smoke render from the packed tarball
        working-directory: npm
        run: |
          mkdir -p "$RUNNER_TEMP/packed"
          tar -xzf mdust-*.tgz -C "$RUNNER_TEMP/packed"
          node -e '
            const { render } = require(process.argv[1]);
            const out = render("# hi");
            if (out !== "<h1>hi</h1>\n") throw new Error(`render returned ${JSON.stringify(out)}`);
            console.log("smoke ok");
          ' "$RUNNER_TEMP/packed/package"

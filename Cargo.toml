[workspace]
resolver = "2"
members = ["crates/mdust", "crates/mdust-wasm"]
exclude = ["bench"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# opt-level 3 costs about 30 KB of wasm for about 6% throughput; the size budget wins.
[profile.wasm]
inherits = "release"
opt-level = "s"

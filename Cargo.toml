[workspace]
resolver = "2"
members = ["crates/mdust", "crates/mdust-wasm"]
exclude = ["bench"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# opt-level 3 buys about 5% throughput for about 36 KB of wasm; speed wins over size (U7).
[profile.wasm]
inherits = "release"
opt-level = 3
